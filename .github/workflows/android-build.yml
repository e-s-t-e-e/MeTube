name: Build Android APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*", "*.*.*" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [ published, edited ]
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name (e.g., 1.0.0)'
        required: false
        default: '1.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Determine Version Name
      id: get_version
      run: |
        if [ "${{ github.event_name }}" = "release" ]; then
          VERSION="${{ github.event.release.tag_name }}"
        elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version_name }}" ]; then
          VERSION="${{ inputs.version_name }}"
        elif [ "${{ github.ref_type }}" = "tag" ]; then
          VERSION="${{ github.ref_name }}"
        else
          VERSION="1.0.0"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Building version: $VERSION"

    - name: Set Android SDK path
      run: echo "sdk.dir=$ANDROID_HOME" > local.properties

    - name: Install Android SDK platform 36
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" --sdk_root=$ANDROID_HOME || \
        echo "y" | $ANDROID_HOME/tools/bin/sdkmanager "platforms;android-36" --sdk_root=$ANDROID_HOME || true

    - name: Build Release APK
      id: build_apk
      continue-on-error: true
      run: |
        ./gradlew assembleRelease -PAPP_VERSION_NAME="${{ steps.get_version.outputs.version }}" --stacktrace 2>&1 | tee build.log
        exit ${PIPESTATUS[0]}

    - name: Upload build log on failure
      if: steps.build_apk.outcome == 'failure'
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
        retention-days: 7

    - name: Fail if build failed
      if: steps.build_apk.outcome == 'failure'
      run: exit 1

    - name: Upload Release APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MeTube-release-apk
        path: app/build/outputs/apk/release/*.apk
        retention-days: 7

    - name: Upload APK to GitHub Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/release/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
